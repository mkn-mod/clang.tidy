
name: clang.tidy
version: master

parent: base
src: mod.cpp
mode: shared
if_arg:
    win_shared: -DYAML_CPP_DLL
    shared: -DKUL_SHARED

profile:
- name: base
  dep: mkn.mod

- name: format
  mod: |
    clang.format{init{style: google, paths: .}}

- name: tidy
  parent: base
  mod: clang.tidy
  src: mod.cpp