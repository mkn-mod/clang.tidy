
name: clang.tidy
property:
  # dependency versions: master on master (not the default branch: mkn.mod's is
  #  the rolling latest, whose mkn.kul differs from a master project's)
  mkn.mod.version: master
version: master

parent: base
src: mod.cpp
mode: shared
if_arg:
    shared: -DMKN_KUL_SHARED

profile:
- name: base
  dep: mkn.mod#${mkn.mod.version}
- name: format
  mod: |
    clang.format#master{init{style: google, paths: .}}

- name: test
  parent: base
  mod: clang.tidy#master
  src: mod.cpp