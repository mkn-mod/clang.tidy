
name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MKN_KUL_GIT_CO: --depth 1
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/download/latest

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: |
        sudo apt-get update && sudo apt-get install -y clang-tidy
        $CURL_GET -o mkn ${PATH_GET}/mkn_nix && chmod +x mkn
        KLOG=2 ./mkn clean build run -dtOa "-std=c++20 -fPIC"
        KLOG=2 ./mkn build -dtOa "-std=c++20 -fPIC" -p test
